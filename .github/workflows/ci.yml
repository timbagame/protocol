name: Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
      - name: Check formatting
        run: bun run format:check
      - name: Check generated contract clients
        run: bun run check:generated
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Test coverage gate
        run: bun test scripts/check-coverage.test.ts
      - name: Enforce 100% line coverage
        run: bun run scripts/check-coverage.ts coverage-scope.json coverage/lcov.info
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - name: Build package
        run: bun run build
      - name: Check generated package
        run: git diff --exit-code -- dist

  rust:
    name: Rust crate
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check parity fixtures
        run: bun run check:rust-fixtures
      - name: Install Rust toolchain
        # Installs the channel and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install Cargo tools
        # Installs the versions pinned in mise.toml, and caches them.
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Audit dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests with coverage
        run: |
          python3 scripts/test-check-rust-coverage.py
          mkdir -p coverage
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path coverage/rust.lcov
          cargo llvm-cov report --summary-only
          python3 scripts/check-rust-coverage.py coverage/rust.lcov coverage-scope.rust.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage/rust.lcov
          if-no-files-found: error

  publish:
    if: >-
      !cancelled() && (github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.validate.result == 'skipped'
    needs: validate
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - validate
      - rust
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. != "failure" and . != "cancelled")' <<< "$RESULTS"
