[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Matches package.json, so a crate and npm release share one protocol version.
version = "0.18.1"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/timbagame/protocol"
publish = false

[workspace.dependencies]
alloy-primitives = "1"
alloy-sol-types = { version = "1", features = ["json"] }
anyhow = "1"
base64 = "0.23"
bs58 = "0.5"
curve25519-dalek = "5"
hex = "0.4"
proptest = { version = "1.12", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
url = "2"
