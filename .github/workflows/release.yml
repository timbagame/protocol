name: Release protocol package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'timbagame/protocol' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release commit is merged
        run: bash scripts/check-release-commit.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@timbagame"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check whether this version is published
        id: version
        run: bun run scripts/check-package-version.ts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Inspect package contents
        if: steps.version.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
