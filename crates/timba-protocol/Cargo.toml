[package]
name = "timba-protocol"
description = "Rust implementation of @timbagame/protocol, checked byte for byte against the TypeScript package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# EVM contract v0.1.0 (alloy bindings, typed data, events and HTTP validation).
evm = ["dep:alloy-primitives", "dep:alloy-sol-types", "dep:anyhow"]

[dependencies]
alloy-primitives = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64.workspace = true
bs58.workspace = true
curve25519-dalek.workspace = true
hex.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
