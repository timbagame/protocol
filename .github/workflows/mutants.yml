name: Mutants
# Mutation testing (scripts/mutants.ts with Stryker for TypeScript, scripts/mutants-rust.sh
# with cargo-mutants for Rust). It never blocks a merge: no other workflow needs it.
# - A pull request mutates the source lines it changed, one job per language, and one
#   comment lists the changes no test noticed, for a follow-up. A pull request that changes
#   a language's setup also runs one real part of it, so a broken setup shows before Saturday.
# - Every week, a quarter of all source, split into 64 parts per language, so four weeks
#   cover everything. What lived is listed in the open "Missed mutants" issue.
on:
  pull_request:
    paths:
      - src/**
      - scripts/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/mutants.toml
      - coverage-scope.json
      - stryker.conf.mjs
      - .github/workflows/mutants.yml
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      quarter:
        description: Which quarter of the parts to run, 0 to 3 (empty for this week's)
        required: false

permissions:
  contents: read

concurrency:
  # A newer push replaces a pull request's run; full runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  scope:
    name: Mutants / Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.scope.outputs.typescript }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Which languages changed
        id: scope
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          has() { grep -Eq "$1" <<< "$changed" && echo true || echo false; }
          echo "typescript=$(has '^(src/|scripts/|coverage-scope\.json$|stryker\.conf\.mjs$|\.github/workflows/mutants\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "rust=$(has '^(crates/|Cargo\.(toml|lock)$|\.cargo/mutants\.toml$|scripts/mutants-rust\.sh$|\.github/workflows/mutants\.yml$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  typescript:
    name: Mutants / Changed code (TypeScript)
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Restore Bun cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate the changed code
        run: bun run scripts/mutants.ts diff HEAD^1 --out build/mutants
      - name: Try one part of everything
        run: |
          if git diff --quiet HEAD^1 -- stryker.conf.mjs scripts/mutants.ts .github/workflows/mutants.yml; then
            echo "The setup didn't change."
          else
            bun run scripts/mutants.ts part 0 64 --out build/mutants-part
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-changed-typescript
          path: |
            build/
            reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  rust:
    name: Mutants / Changed code (Rust)
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Install Rust toolchain
        # Installs the channel and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Cache cargo-mutants
        # The script installs the version it pins, once per toolchain.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'scripts/mutants-rust.sh') }}
      - name: Mutate the changed code
        run: scripts/mutants-rust.sh diff HEAD^1 --out build/mutants
      - name: Try one part of everything
        run: |
          if git diff --quiet HEAD^1 -- .cargo/mutants.toml scripts/mutants-rust.sh .github/workflows/mutants.yml; then
            echo "The setup didn't change."
          else
            scripts/mutants-rust.sh shard 0/64 --out build/mutants-part
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-changed-rust
          path: |
            build/mutants/
            build/mutants-part/
            build/mutants-rust/mutants.out/
          retention-days: 14
          if-no-files-found: ignore

  comment:
    name: Mutants / Comment
    needs: [scope, typescript, rust]
    # Not when a language's job broke: its results would look like every change caught.
    if: ${{ !cancelled() && needs.scope.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download results
        if: needs.typescript.result == 'success' || needs.rust.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-changed-*
          path: results
      - name: Comment what lived
        # A fork's token can't comment; its run page has the summary.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The changed code's results, not the setup trial's, from each language.
          mapfile -t dirs < <(find results -name tally.txt -not -path '*-part/*' -printf '%h\n' 2>/dev/null | sort)
          (( ${#dirs[@]} )) || dirs=(results)
          scripts/mutants-comment.sh "${dirs[@]}"

  plan:
    name: Mutants / Plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Pick this week's parts
        id: plan
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          quarter=${QUARTER:-$(( $(date -u +%s) / 604800 % 4 ))}
          [[ $quarter =~ ^[0-3]$ ]] || { echo "Quarter must be 0 to 3, got $quarter" >&2; exit 1; }
          echo "parts=$(jq -cn --argjson q "$quarter" '[range($q * 16; $q * 16 + 16)]')" >> "$GITHUB_OUTPUT"

  typescript-part:
    name: Mutants / Part ${{ matrix.part }} of 64 (TypeScript)
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Restore Bun cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Lived changes are findings for the issue; only a run that never got to its tally fails.
      - name: Mutation testing
        run: bun run scripts/mutants.ts part "${{ matrix.part }}" 64 --out build/mutants
      - name: Upload what lived
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-typescript-${{ matrix.part }}
          path: |
            build/mutants/
            reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  rust-part:
    name: Mutants / Part ${{ matrix.part }} of 64 (Rust)
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        # Installs the channel and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Restore cargo-mutants
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'scripts/mutants-rust.sh') }}
      # Missed and timed out mutants are findings for the issue; only a run that never got to its tally fails.
      - name: Mutation testing
        run: scripts/mutants-rust.sh shard "${{ matrix.part }}/64" --out build/mutants
      - name: Upload what lived
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-rust-${{ matrix.part }}
          path: build/mutants/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Mutants / Report
    needs: [plan, typescript-part, rust-part]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test report posting
        run: bash scripts/mutants-post.test.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-part-*
          path: results
      - name: List what lived in the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTS: ${{ needs.plan.outputs.parts }}
          JOBS: ${{ needs.typescript-part.result }} (TypeScript), ${{ needs.rust-part.result }} (Rust)
        run: |
          lived=$(find results -name lived.txt -exec cat {} + 2>/dev/null | sort -u || true)
          parts=$(jq -r 'map(tostring) | join(", ")' <<< "$PARTS")
          # A part whose job died leaves no artifact, so its mutants are in no list below.
          lost=$(jq -r '.[]' <<< "$PARTS" | while read -r part; do
            for kind in typescript:TypeScript rust:Rust; do
              [ -d "results/mutants-part-${kind%%:*}-$part" ] || echo "$part (${kind#*:})"
            done
          done | paste -sd, - | sed 's/,/, /g')
          {
            echo "Parts $parts of 64: [run]($RUN), jobs $JOBS."
            echo
            if [ -n "$lost" ]; then
              echo "**No results from part $lost, so its mutants are not listed.** Rerun the failed jobs of the run."
              echo
            fi
            if [ -z "$lived" ] && [ -z "$lost" ]; then
              echo 'Every change in these parts was caught by a test.'
            else
              for status in findings timeout; do
                if [ "$status" = timeout ]; then
                  rows=$(grep '  timeout:' <<< "$lived" || true)
                  heading='Timed out'
                  note='Stryker stopped these changes at its timeout.'
                else
                  rows=$(grep -v '  timeout:' <<< "$lived" || true)
                  heading='Lived'
                  note='No test noticed these changes. Real gaps get their own PR; changes that keep the same behavior can be ignored.'
                fi
                if [ -n "$rows" ]; then
                  echo "### $heading ($(wc -l <<< "$rows"))"
                  echo "$note"
                  echo '```'
                  echo "$rows"
                  echo '```'
                fi
              done
            fi
          } > report.md
          head -c 1000000 report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\nFull report: %s#artifacts\n' "$RUN" >> "$GITHUB_STEP_SUMMARY"
          has_findings=false
          [ -z "$lived" ] || has_findings=true
          [ -z "$lost" ] || has_findings=true
          scripts/mutants-post.sh report.md "$has_findings"
