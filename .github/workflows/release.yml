name: Release protocol package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'timbagame/protocol' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release commit is merged
        run: bash scripts/check-release-commit.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: https://npm.pkg.github.com
          scope: "@timbagame"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Check whether this version is published
        id: version
        run: bun run scripts/check-package-version.ts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Inspect package contents
        if: steps.version.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        # Tags the commit npm recorded for this version, so a rerun or the next push to main
        # backfills a release that is missing, even when npm skipped the publish.
        run: |
          version=$(jq -r .version package.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; skipping"
            exit 0
          fi
          head=$(npm view "@timbagame/protocol@$version" gitHead --registry=https://npm.pkg.github.com)
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "@timbagame/protocol@$version has no recorded commit" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$head" refs/remotes/origin/main
          gh release create "v$version" --target "$head" --title "v$version" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
